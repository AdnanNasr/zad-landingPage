services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: zad-landing-page:latest
    container_name: zad-landing-page
    restart: unless-stopped
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
